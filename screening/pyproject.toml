[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant_bioeng_filter"
version = "0.1.0"
description = "Filter local PMC text articles down to plant-bioengineering primary research."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Plant Bioeng Filter" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
plant-bioeng-filter = "plant_bioeng_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plant_bioeng_filter*"]
